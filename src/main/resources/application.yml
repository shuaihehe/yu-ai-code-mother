spring:
  application:
    name: yu-ai-code-mother-backend
  # mysql 配置已移至 application-local.yml
  # session 配置（store-type 自 Spring Boot 3 起已移除，无需也无法指定；
  # 只要引入 spring-session-data-redis 依赖且存在 Redis 连接工厂，就会自动存入 Redis）
  session:
    # session 30 天过期
    timeout: 2592000
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
